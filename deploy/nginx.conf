# ---------------------------------------------------------------------------
# CGS Finance System — nginx site config for a VPS
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cgs
#   sudo ln -s /etc/nginx/sites-available/cgs /etc/nginx/sites-enabled/cgs
#   sudo nginx -t && sudo systemctl reload nginx
#
# Build the frontend first:  npm run build   ->  dist/
# Run the API with pm2:      pm2 start backend/src/server.js --name cgs-api
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name your-domain.com;

    root /var/www/cgs/dist;
    index index.html;

    # gzip matters a lot here — the JS assets compress ~3.5x.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml font/woff font/woff2;

    # Hashed asset filenames are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # API -> Express
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback. Without this, refreshing /invoices/123 returns 404 —
    # and index.html must never be cached or users get stale asset references.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
